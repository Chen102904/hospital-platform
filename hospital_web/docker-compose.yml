# 医院信息管理系统 一键启动
# 用法：docker compose up --build
# 首次启动会自动：建库建表 → 灌演示数据 → 起 Flask
# 访问：http://localhost:5000  账号 admin / admin123
#
# 数据库密码不写在文件里（这个仓库是公开的）：
#   - 什么都不设 → 密码就是字面量 CHANGE_ME，只能本地开发用，别往公网部署
#   - 想用自己的 → 复制 .env.example 为 .env，改 MYSQL_ROOT_PASSWORD
#     （.env 已被 .gitignore 排除，不会提交）
services:
  mysql:
    image: mysql:8.0
    container_name: his_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
      MYSQL_DATABASE: hospital_db
      TZ: Asia/Shanghai
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - his_mysql_data:/var/lib/mysql
      # 首次启动自动执行：建 15 张表 → 灌演示数据（顺序按文件名）
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-CHANGE_ME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: his_web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
      DB_NAME: hospital_db
      TZ: Asia/Shanghai
    ports:
      - "5000:5000"

volumes:
  his_mysql_data:
